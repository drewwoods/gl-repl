<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="gl-repl">
    <defs>
        <clipPath id="floor">
            <rect x="0" y="240" width="1280" height="200"/>
        </clipPath>
        <clipPath id="trap">
            <polygon points="640,0 -200,200 1480,200"/>
        </clipPath>
        <linearGradient id="line-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="white" stop-opacity="0"/>
            <stop offset="0.35" stop-color="white" stop-opacity="0.85"/>
            <stop offset="1" stop-color="white" stop-opacity="1"/>
        </linearGradient>
        <mask id="line-fade-mask">
            <rect x="-260" y="0" width="1800" height="200" fill="url(#line-fade)"/>
        </mask>
        <linearGradient id="grhv-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0a0014"/>
            <stop offset="0.5" stop-color="#1a0033"/>
            <stop offset="0.65" stop-color="#ff00aa" stop-opacity="0.45"/>
            <stop offset="0.78" stop-color="#00ffff" stop-opacity="0.15"/>
            <stop offset="1" stop-color="#000000"/>
        </linearGradient>
        <linearGradient id="grhv-chrome" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.42" stop-color="#00ffff"/>
            <stop offset="0.5" stop-color="#0088aa"/>
            <stop offset="0.58" stop-color="#ff00aa"/>
            <stop offset="1" stop-color="#5a0066"/>
        </linearGradient>
        <radialGradient id="grhv-glow" cx="0.5" cy="0.7" r="0.6">
            <stop offset="0" stop-color="#ff00aa" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ff00aa" stop-opacity="0"/>
        </radialGradient>
        <filter id="grhv-bloom" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="1280" height="440" fill="url(#grhv-sky)"/>
    <rect x="0" y="220" width="1280" height="140" fill="url(#grhv-glow)"/>
    <g clip-path="url(#floor)">
        <g transform="translate(0 240)">
            <g clip-path="url(#trap)" mask="url(#line-fade-mask)">
                <g>
                    <animateTransform attributeName="transform" type="scale" from="1 1" to="1 1.1765" dur="2.4s" repeatCount="indefinite"/>
                    <line x1="-260" y1="200.00" x2="1540" y2="200.00" stroke="#ff66cc" stroke-width="2.30"/>
                    <line x1="-260" y1="170.00" x2="1540" y2="170.00" stroke="#ff00aa" stroke-width="2.06"/>
                    <line x1="-260" y1="144.50" x2="1540" y2="144.50" stroke="#ff00aa" stroke-width="1.86"/>
                    <line x1="-260" y1="122.83" x2="1540" y2="122.83" stroke="#ff00aa" stroke-width="1.68"/>
                    <line x1="-260" y1="104.40" x2="1540" y2="104.40" stroke="#ff66cc" stroke-width="1.54"/>
                    <line x1="-260" y1="88.74" x2="1540" y2="88.74" stroke="#ff00aa" stroke-width="1.41"/>
                    <line x1="-260" y1="75.43" x2="1540" y2="75.43" stroke="#ff00aa" stroke-width="1.30"/>
                    <line x1="-260" y1="64.12" x2="1540" y2="64.12" stroke="#ff00aa" stroke-width="1.21"/>
                    <line x1="-260" y1="54.50" x2="1540" y2="54.50" stroke="#ff66cc" stroke-width="1.14"/>
                    <line x1="-260" y1="46.32" x2="1540" y2="46.32" stroke="#ff00aa" stroke-width="1.07"/>
                    <line x1="-260" y1="39.37" x2="1540" y2="39.37" stroke="#ff00aa" stroke-width="1.01"/>
                    <line x1="-260" y1="33.47" x2="1540" y2="33.47" stroke="#ff00aa" stroke-width="0.97"/>
                    <line x1="-260" y1="28.45" x2="1540" y2="28.45" stroke="#ff66cc" stroke-width="0.93"/>
                    <line x1="-260" y1="24.18" x2="1540" y2="24.18" stroke="#ff00aa" stroke-width="0.89"/>
                    <line x1="-260" y1="20.55" x2="1540" y2="20.55" stroke="#ff00aa" stroke-width="0.86"/>
                    <line x1="-260" y1="17.47" x2="1540" y2="17.47" stroke="#ff00aa" stroke-width="0.84"/>
                </g>
            </g>
            <line x1="640" y1="0" x2="-200" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="-40" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="120" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="280" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="440" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="560" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="640" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="720" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="840" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="1000" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="1160" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="1320" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
            <line x1="640" y1="0" x2="1480" y2="200" stroke="#00ffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
        </g>
    </g>
    <g transform="translate(60 90)" filter="url(#grhv-bloom)">
        <animate attributeName="opacity" values="1;1;1;0.55;1;0.4;1;1;1" dur="5s" repeatCount="indefinite"/>
        <text x="0" y="0" fill="url(#grhv-chrome)" font-family="'Courier New', monospace" font-size="84" font-weight="900" letter-spacing="-2">
            GL-REPL
        </text>
        <rect x="2" y="14" width="362" height="2" fill="#ff00aa" opacity="0.7"/>
        <text x="4" y="38" fill="#00ffff" font-family="monospace" font-size="12" letter-spacing="4">
            IMMEDIATE  MODE //// H+V PASS
        </text>
    </g>
    <g transform="translate(60 165)" font-family="monospace" font-size="14" fill="#00ffff">
        <rect x="-10" y="-22" width="560" height="218" fill="#0a0014" stroke="#ff00aa" stroke-width="1.4" opacity="0.94"/>
        <text x="0" y="0">
            &gt; glColor3f(
            <tspan fill="#ff66cc">
            1.0
        </tspan>
        ,
        <tspan fill="#ff66cc">
        0.0
    </tspan>
    ,
    <tspan fill="#ff66cc">
    0.7
</tspan>
);
</text>
<text x="0" y="22">
    &gt; glBegin(
    <tspan fill="#ff66cc">
    GL_LINES
</tspan>
);
</text>
<text x="0" y="44">
    &gt; for(i,
    <tspan fill="#ff66cc">
    -10
</tspan>
,
<tspan fill="#ff66cc">
10
</tspan>
) {
</text>
<text x="0" y="66">
    &gt;   glVertex3f(
    <tspan fill="#ff66cc">
    -50
</tspan>
,
<tspan fill="#ff66cc">
0
</tspan>
, i + (
<tspan fill="#ffe600">
t
</tspan>
%
<tspan fill="#ff66cc">
1
</tspan>
));
</text>
<text x="0" y="86">
    &gt;   glVertex3f(
    <tspan fill="#ff66cc">
    50
</tspan>
,
<tspan fill="#ff66cc">
0
</tspan>
, i + (
<tspan fill="#ffe600">
t
</tspan>
%
<tspan fill="#ff66cc">
1
</tspan>
));
</text>
<text x="0" y="108">
    &gt;   glVertex3f(i,
    <tspan fill="#ff66cc">
    0
</tspan>
,
<tspan fill="#ff66cc">
-50
</tspan>
);
</text>
<text x="0" y="130">
    &gt;   glVertex3f(i,
    <tspan fill="#ff66cc">
    0
</tspan>
,
<tspan fill="#ff66cc">
50
</tspan>
);
</text>
<text x="0" y="152">
    &gt; }
</text>
<text x="0" y="174">
    &gt; glEnd()
    <tspan fill="#ff00aa">
    █
    <animate attributeName="opacity" values="1;1;0;0" dur="1s"
    repeatCount="indefinite"/>
</tspan>
</text>
</g>
<g fill="#00ffff" opacity="0.04">
    <rect x="0" y="0" width="1280" height="2"/>
    <rect x="0" y="6" width="1280" height="2"/>
    <rect x="0" y="12" width="1280" height="2"/>
    <rect x="0" y="18" width="1280" height="2"/>
    <rect x="0" y="24" width="1280" height="2"/>
    <rect x="0" y="30" width="1280" height="2"/>
</g>
</svg>
