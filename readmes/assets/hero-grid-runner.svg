<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="gl-repl — OpenGL immediate-mode REPL">
  <defs>
    <linearGradient id="gr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0014"></stop>
      <stop offset="0.55" stop-color="#1a0033"></stop>
      <stop offset="0.62" stop-color="#ff00aa" stop-opacity="0.55"></stop>
      <stop offset="0.7" stop-color="#00ffff" stop-opacity="0.15"></stop>
      <stop offset="1" stop-color="#000000"></stop>
    </linearGradient>
    <linearGradient id="gr-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe600"></stop>
      <stop offset="0.4" stop-color="#ff00aa"></stop>
      <stop offset="1" stop-color="#7c00ff"></stop>
    </linearGradient>
    <linearGradient id="gr-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.42" stop-color="#00ffff"></stop>
      <stop offset="0.5" stop-color="#0088aa"></stop>
      <stop offset="0.58" stop-color="#ff00aa"></stop>
      <stop offset="1" stop-color="#5a0066"></stop>
    </linearGradient>
    <radialGradient id="gr-glow" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ff00aa" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#ff00aa" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="gr-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="gr-bigbloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
  </defs>

  
  <rect width="1280" height="440" fill="url(#gr-sky)"></rect>
  
  <rect x="0" y="200" width="1280" height="120" fill="url(#gr-glow)"></rect>

  
  <g transform="translate(640 220)" filter="url(#gr-bigbloom)">
    <circle r="78" fill="url(#gr-sun)"></circle>
    <rect x="-80" y="-4" width="160" height="3" fill="#0a0014"></rect>
    <rect x="-80" y="8" width="160" height="4" fill="#0a0014"></rect>
    <rect x="-80" y="22" width="160" height="5" fill="#0a0014"></rect>
    <rect x="-80" y="38" width="160" height="6" fill="#0a0014"></rect>
    <rect x="-80" y="56" width="160" height="8" fill="#0a0014"></rect>
  </g>

  
  <g clip-path="inset(255px 0 0 0)">
    <g transform="translate(0 260)">
      
      <g class="grid-roll">
        <line class="hline" x1="-200" y1="0" x2="1480" y2="0"></line>
        <line class="hline" x1="-200" y1="14" x2="1480" y2="14"></line>
        <line class="hline" x1="-200" y1="34" x2="1480" y2="34"></line>
        <line class="hline-bright" x1="-200" y1="60" x2="1480" y2="60"></line>
        <line class="hline" x1="-200" y1="94" x2="1480" y2="94"></line>
        <line class="hline-bright" x1="-200" y1="138" x2="1480" y2="138"></line>
        <line class="hline" x1="-200" y1="180" x2="1480" y2="180"></line>
      </g>
      
      <g stroke-linecap="round">
        <line class="vline" x1="640" y1="0" x2="-200" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="-40" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="120" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="280" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="440" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="560" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="640" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="720" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="840" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="1000" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="1160" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="1320" y2="200"></line>
        <line class="vline" x1="640" y1="0" x2="1480" y2="200"></line>
      </g>
    </g>
  </g>

  
  <g class="torus-spin" filter="url(#gr-bloom)">
    <g transform="translate(1090 220)">
      
      <ellipse class="torus" cx="0" cy="0" rx="105" ry="34"></ellipse>
      <ellipse class="torus-mag" cx="0" cy="0" rx="80" ry="22"></ellipse>
      <ellipse class="torus" cx="0" cy="0" rx="55" ry="13"></ellipse>
      
      <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.7">
        <path d="M -105 0 q 0 -22 25 -22"></path>
        <path d="M -80 -22 q 0 -22 25 -10"></path>
        <path d="M -55 0 q 0 -16 25 -16"></path>
        <path d="M -30 -14 q 0 -10 25 0"></path>
        <path d="M 5 -14 q 0 -10 25 -2"></path>
        <path d="M 30 -8 q 0 -14 25 -14"></path>
        <path d="M 55 -16 q 0 -18 25 -8"></path>
        <path d="M 80 -22 q 0 -22 25 0"></path>
      </g>
      <g stroke="#ff66cc" stroke-width="1" fill="none" opacity="0.5">
        <path d="M -105 2 q 0 22 25 22"></path>
        <path d="M -80 22 q 0 22 25 10"></path>
        <path d="M -55 6 q 0 16 25 16"></path>
        <path d="M -30 14 q 0 10 25 0"></path>
        <path d="M 5 14 q 0 10 25 2"></path>
        <path d="M 30 8 q 0 14 25 14"></path>
        <path d="M 55 16 q 0 18 25 8"></path>
        <path d="M 80 22 q 0 22 25 0"></path>
      </g>
    </g>
  </g>

  
  <g class="logo" transform="translate(60 130)" filter="url(#gr-bloom)">
    <text x="0" y="0" fill="url(#gr-chrome)" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="124" font-weight="900" letter-spacing="-2">GL-REPL</text>
    
    <rect x="2" y="22" width="538" height="3" fill="#ff00aa" opacity="0.6"></rect>
    <text x="4" y="62" fill="#00ffff" font-family="ui-monospace, &#39;Courier New&#39;, monospace" font-size="18" letter-spacing="6">IMMEDIATE  MODE  ////  RENDER  BY  TYPING</text>
  </g>

  
  <g transform="translate(60 280)" font-family="ui-monospace, &#39;Courier New&#39;, monospace" font-size="16" fill="#00ffff">
    <rect x="-8" y="-22" width="500" height="86" fill="#0a0014" stroke="#ff00aa" stroke-width="1.2" opacity="0.85"></rect>
    <text x="0" y="0">&gt; glTranslatef(0, 0, -5);</text>
    <text x="0" y="22">&gt; glRotatef(t*30, 0, 1, 0);</text>
    <text x="0" y="44">&gt; glutSolidTorus(0.3, 0.8, 24, 36)<tspan class="caret" fill="#ff00aa">█</tspan></text>
  </g>

  
  <g>
    <rect class="scan" x="0" y="0" width="1280" height="2"></rect>
    <rect class="scan" x="0" y="6" width="1280" height="2"></rect>
    <rect class="scan" x="0" y="12" width="1280" height="2"></rect>
    <rect class="scan" x="0" y="18" width="1280" height="2"></rect>
    <rect class="scan" x="0" y="24" width="1280" height="2"></rect>
    <rect class="scan" x="0" y="30" width="1280" height="2"></rect>
  </g>

  
  <rect width="1280" height="440" fill="black" opacity="0" pointer-events="none"></rect>
</svg>