<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="gl-repl — blueprint">
  <defs>
    <pattern id="bp-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c3a52" stroke-width="0.6"></path>
    </pattern>
    <pattern id="bp-grid-fine" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#142a3c" stroke-width="0.4"></path>
    </pattern>
    <filter id="bp-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
  </defs>

  
  <rect width="1280" height="440" fill="#0a1929"></rect>
  <rect width="1280" height="440" fill="url(#bp-grid-fine)"></rect>
  <rect width="1280" height="440" fill="url(#bp-grid)"></rect>

  
  <rect x="20" y="20" width="1240" height="400" fill="none" stroke="#3fcbff" stroke-width="1.2"></rect>
  <rect x="20" y="20" width="1240" height="400" fill="none" stroke="#3fcbff" stroke-width="0.6" opacity="0.5" transform="translate(6 6)"></rect>

  
  <g stroke="#3fcbff" stroke-width="1">
    <path d="M 20 60 L 60 60 M 60 20 L 60 60"></path>
    <path d="M 1260 60 L 1220 60 M 1220 20 L 1220 60"></path>
    <path d="M 20 380 L 60 380 M 60 380 L 60 420"></path>
    <path d="M 1260 380 L 1220 380 M 1220 380 L 1220 420"></path>
  </g>

  
  <g transform="translate(60 100)">
    <text fill="#aef2ff" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="80" font-weight="700" letter-spacing="-2">gl-repl</text>
    <text y="42" fill="#7fdcff" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="14" letter-spacing="3">OpenGL Immediate-Mode REPL</text>
    <text y="76" fill="#3fcbff" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="12" letter-spacing="2" opacity="0.85">DRAWING  No. GL-0001          SCALE  1:1          REV  0.1</text>

    
    <g transform="translate(0 110)" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="11" letter-spacing="1">
      <rect x="0" y="0" width="380" height="120" fill="none" stroke="#3fcbff" stroke-width="0.8"></rect>
      <line x1="0" y1="30" x2="380" y2="30" stroke="#3fcbff" stroke-width="0.6"></line>
      <line x1="0" y1="60" x2="380" y2="60" stroke="#3fcbff" stroke-width="0.6"></line>
      <line x1="0" y1="90" x2="380" y2="90" stroke="#3fcbff" stroke-width="0.6"></line>
      <line x1="120" y1="0" x2="120" y2="120" stroke="#3fcbff" stroke-width="0.6"></line>
      <g fill="#7fdcff">
        <text x="10" y="20">PROJECT</text>
        <text x="10" y="50">LANG</text>
        <text x="10" y="80">PIPELINE</text>
        <text x="10" y="110">CONTEXT</text>
      </g>
      <g fill="#e6f7ff">
        <text x="130" y="20">gl-repl :: a sandbox for typing geometry</text>
        <text x="130" y="50">C2x + freeglut</text>
        <text x="130" y="80">fixed-function (immediate mode)</text>
        <text x="130" y="110">OpenGL 1.1 / GLU / GLUT</text>
      </g>
    </g>
  </g>

  
  <g class="teapot" filter="url(#bp-glow)">
    <g transform="translate(880 220)" stroke="#aef2ff" stroke-width="1.1" fill="none">
      
      <ellipse cx="0" cy="0" rx="90" ry="60"></ellipse>
      <ellipse cx="0" cy="0" rx="90" ry="14" opacity="0.7"></ellipse>
      <ellipse cx="0" cy="-30" rx="78" ry="10" opacity="0.55"></ellipse>
      <ellipse cx="0" cy="30" rx="78" ry="10" opacity="0.55"></ellipse>
      
      <path d="M -90 0 q 0 -60 90 -60 q 90 0 90 60 q 0 60 -90 60 q -90 0 -90 -60 Z" opacity="0.3"></path>
      
      <path d="M 78 -20 q 40 -10 70 -50 q 6 -10 -2 -16 q -10 -6 -16 4 q -22 32 -58 36"></path>
      
      <path d="M -82 -16 q -50 -8 -50 30 q 0 40 50 30"></path>
      
      <ellipse cx="0" cy="-58" rx="36" ry="8"></ellipse>
      <line x1="0" y1="-66" x2="0" y2="-78"></line>
      <circle cx="0" cy="-82" r="6"></circle>
      
      <path d="M -90 0 q 90 -28 180 0" opacity="0.6"></path>
      <path d="M -90 0 q 90 28 180 0" opacity="0.6"></path>
    </g>
  </g>

  
  <g transform="translate(880 380)" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="11">
    <line class="axis-x" stroke="#ff7676" stroke-width="2" x1="0" y1="0" x2="60" y2="0"></line>
    <polygon class="axis-x" fill="#ff7676" points="60,-4 70,0 60,4"></polygon>
    <text x="76" y="4" fill="#ff7676">+X</text>
    <line class="axis-y" stroke="#7fff9b" stroke-width="2" x1="0" y1="0" x2="0" y2="-50"></line>
    <polygon class="axis-y" fill="#7fff9b" points="-4,-50 0,-60 4,-50"></polygon>
    <text x="6" y="-58" fill="#7fff9b">+Y</text>
    <line class="axis-z" stroke="#7fb3ff" stroke-width="2" x1="0" y1="0" x2="-36" y2="22"></line>
    <polygon class="axis-z" fill="#7fb3ff" points="-32,16 -42,24 -34,28"></polygon>
    <text x="-56" y="34" fill="#7fb3ff">+Z</text>
  </g>

  
  <g class="dim" transform="translate(880 220)">
    <line x1="-120" y1="-100" x2="-120" y2="100"></line>
    <line x1="-126" y1="-100" x2="-114" y2="-100"></line>
    <line x1="-126" y1="100" x2="-114" y2="100"></line>
    <line x1="-110" y1="-78" x2="-110" y2="-70"></line>
    <text class="anno" x="-176" y="6">Ø  200u</text>
  </g>
  <g class="dim" transform="translate(880 220)">
    <line x1="-100" y1="120" x2="100" y2="120"></line>
    <line x1="-100" y1="114" x2="-100" y2="126"></line>
    <line x1="100" y1="114" x2="100" y2="126"></line>
    <text class="anno" x="-22" y="140">L = 200u</text>
  </g>

  
  <g>
    <line class="march" stroke="#aef2ff" x1="700" y1="220" x2="780" y2="220"></line>
    <circle cx="700" cy="220" r="3" fill="#aef2ff"></circle>
    <text class="anno-bright" x="510" y="216">glutSolidTeapot(1.0)</text>
    <text class="anno" x="510" y="232">// REPL line 34</text>
  </g>

  
  <g transform="translate(60 380)" font-family="&#39;Courier New&#39;, ui-monospace, monospace" font-size="11" letter-spacing="1.5">
    <text fill="#7fdcff">PRESS ;  TO  COMMIT          CTRL+T  TIME          F1  HELP          F12  CYCLE</text>
  </g>
</svg>