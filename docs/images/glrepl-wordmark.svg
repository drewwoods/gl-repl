<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" role="img" aria-label="gl-repl — immediate mode, immediately">
  <!-- gl-repl wordmark lockup: the adopted open-cube mark (vector twin of the
       app's own render of examples/scenes/lit-cube.glr, grid off) beside the
       name and tagline.  Its background is transparent so the README's
       theme supplies the ground; on prefers-color-scheme:light the
       edges/name go ink (the dark-edged reading matches the original
       lit-cube screenshots).  Companions: docs/images/logo.svg
       (mark alone), packaging/macos/gl-repl-open-cube.svg (app icon). -->
  <style>
    .edge { stroke: #ffffff; }
    .name { fill: #e6eaf5; }
    .tag  { fill: #8a93a3; }
    @media (prefers-color-scheme: light) {
      .edge { stroke: #232a36; }
      .name { fill: #10151d; }
      .tag  { fill: #5c6572; }
    }
  </style>
  <defs>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="70" y1="60" x2="145" y2="100">
      <stop offset="0" stop-color="#b6bad5"/>
      <stop offset="1" stop-color="#d9dbeb"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="135" y1="60" x2="145" y2="170">
      <stop offset="0" stop-color="#e1e3e9"/>
      <stop offset="1" stop-color="#bfc2cb"/>
    </linearGradient>
    <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="60" y1="118" x2="108" y2="100">
      <stop offset="0" stop-color="#2b96ec"/>
      <stop offset="1" stop-color="#5ab4f6"/>
    </linearGradient>
    <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="108" y1="115" x2="75" y2="160">
      <stop offset="0" stop-color="#fb4ce4"/>
      <stop offset="1" stop-color="#ee35d6"/>
    </linearGradient>
  </defs>
  <!-- the mark: isometric basis, hexagon corners (±45.2, ∓26.1), (0, ±52.3) -->
  <g transform="translate(110,110) scale(1.7)">
    <polygon points="-45.2,-26.1 0,-52.3 45.2,-26.1 0,0" fill="url(#top)"/>
    <polygon points="0,0 45.2,-26.1 45.2,26.1 0,52.3" fill="url(#side)"/>
    <polygon points="-45.2,-26.1 0,0 -45.2,26.1" fill="url(#wall)"/>
    <polygon points="0,0 0,52.3 -45.2,26.1" fill="url(#floor)"/>
    <g class="edge" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="0,-52.3 45.2,-26.1 45.2,26.1 0,52.3 -45.2,26.1 -45.2,-26.1"/>
      <polyline points="-45.2,-26.1 0,0 45.2,-26.1"/>
      <polyline points="0,0 0,52.3"/>
      <polyline points="0,0 -45.2,26.1"/>
    </g>
  </g>
  <g font-family="'Courier New', ui-monospace, 'SF Mono', Menlo, monospace">
    <text class="name" x="228" y="122" font-size="72" font-weight="900" letter-spacing="-3" fill="#e6eaf5">gl-repl</text>
    <text class="tag" x="232" y="156" font-size="16" letter-spacing="2" fill="#8a93a3">immediate mode, immediately</text>
  </g>
</svg>
