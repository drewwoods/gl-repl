# repl_live_demo.ini -- scenes + options for the live, file-watching REPL demo.
#
# Edit the scene files below in your own editor (vim, ...) and save; the demo
# re-imports the active scene on change. Cycle scenes with [ and ], reload with
# r. Scene paths are resolved relative to THIS file's directory, so the bundled
# `./repl_live_demo` (run from the repo root) finds them without a cd.

window=960x720
poll_ms=250
panel=on

scene=scenes/triangle.c
scene=scenes/ring.c
scene=scenes/torus.c
scene=scenes/whale-full-c.c
