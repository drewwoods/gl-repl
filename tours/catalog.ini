# Built-in guided-tour catalog. Section order is the Tours menu row order.
# Section headers are stable IDs; `name` is the user-visible tour name.
#
# Each `file` is a pointer script (grammar: src/app/glr_pointer_script.h)
# compiled into the binary by scripts/gen_tours.py. Author points as
# SYMBOLIC targets (menu:/item:/subenter:/sub:/pin:/scene:) so the tour
# plays at any window size; the files are also directly usable as
# GLR_POINTER_SCRIPT= / record-video.sh --script inputs for previewing a
# tour headlessly before shipping it.
[start-here]
file = start-here.pointer
name = Start Here

[highlights]
file = highlights.pointer
name = Highlights
prereq_free_scenes = 1

[editing-basics]
file = editing-basics.pointer
name = Editing Basics
prereq_free_scenes = 1

[camera-and-views]
file = camera-and-views.pointer
name = Camera & Views

[overlays-and-scope]
file = overlays-and-scope.pointer
name = Overlays & Scope

[getting-help]
file = getting-help.pointer
name = Getting Help
