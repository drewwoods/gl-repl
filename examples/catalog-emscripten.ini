# Emscripten/web-build example catalog. Selected by the OpenGL-Vibe
# emscripten/build.sh (EXAMPLES_CATALOG override) so the web build can ship a
# trimmed set — drop examples that are too heavy or unsupported in the browser
# by deleting their [section] here. Keep in sync with catalog.ini for the
# examples that DO ship; the format is identical (see catalog.ini for docs).
# Section order is the flat F12 / --example index order.
# Section headers are stable IDs; `name` is the user-visible example name.
