<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="gl-repl">
  <!-- Garish early-90s 3D-WordArt alt icon. gl-repl.svg keeps the cube. -->
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#2a0d6b" />
      <stop offset="0.5" stop-color="#7d1fa8" />
      <stop offset="1"   stop-color="#08030f" />
    </linearGradient>
    <radialGradient id="rsun" cx="0.5" cy="0.40" r="0.6">
      <stop offset="0"   stop-color="#ff58c8" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#7d1fa8" stop-opacity="0.5" />
      <stop offset="1"   stop-color="#7d1fa8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d0"/><stop offset="0.40" stop-color="#ffe07a"/>
      <stop offset="0.50" stop-color="#e0a017"/><stop offset="0.52" stop-color="#7a4500"/>
      <stop offset="0.88" stop-color="#ffd24d"/><stop offset="1" stop-color="#fff3c0"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff43c8" stop-opacity="0" />
      <stop offset="1" stop-color="#ff43c8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="rglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="word">
      <text x="512" y="0" text-anchor="middle"
            font-family="Futura, 'Helvetica Neue', Helvetica, sans-serif"
            font-weight="700" font-size="258" letter-spacing="-10">gl-repl</text>
    </g>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" /></clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#rbg)" />
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#rsun)" />
  <g clip-path="url(#round)" stroke="url(#grid)" stroke-width="3" opacity="0.85">
    <line x1="0" y1="730" x2="1024" y2="730" /><line x1="0" y1="772" x2="1024" y2="772" />
    <line x1="0" y1="826" x2="1024" y2="826" /><line x1="0" y1="892" x2="1024" y2="892" />
    <line x1="0" y1="970" x2="1024" y2="970" />
    <line x1="512" y1="712" x2="-260" y2="1024" /><line x1="512" y1="712" x2="40" y2="1024" />
    <line x1="512" y1="712" x2="250" y2="1024" /><line x1="512" y1="712" x2="410" y2="1024" />
    <line x1="512" y1="712" x2="512" y2="1024" /><line x1="512" y1="712" x2="614" y2="1024" />
    <line x1="512" y1="712" x2="774" y2="1024" /><line x1="512" y1="712" x2="984" y2="1024" />
    <line x1="512" y1="712" x2="1284" y2="1024" />
  </g>
  <g transform="translate(0 475) skewX(-11)" filter="url(#rglow)">
    <use href="#word" transform="translate(52.0 64.0)" fill="#1c0e00" />
    <use href="#word" transform="translate(49.1 60.4)" fill="#261601" />
    <use href="#word" transform="translate(46.2 56.9)" fill="#2f1e02" />
    <use href="#word" transform="translate(43.3 53.3)" fill="#392604" />
    <use href="#word" transform="translate(40.4 49.8)" fill="#432e05" />
    <use href="#word" transform="translate(37.6 46.2)" fill="#4c3706" />
    <use href="#word" transform="translate(34.7 42.7)" fill="#563f07" />
    <use href="#word" transform="translate(31.8 39.1)" fill="#604708" />
    <use href="#word" transform="translate(28.9 35.6)" fill="#694f09" />
    <use href="#word" transform="translate(26.0 32.0)" fill="#73570a" />
    <use href="#word" transform="translate(23.1 28.4)" fill="#7d5f0c" />
    <use href="#word" transform="translate(20.2 24.9)" fill="#86670d" />
    <use href="#word" transform="translate(17.3 21.3)" fill="#906f0e" />
    <use href="#word" transform="translate(14.4 17.8)" fill="#9a770f" />
    <use href="#word" transform="translate(11.6 14.2)" fill="#a38010" />
    <use href="#word" transform="translate(8.7 10.7)" fill="#ad8812" />
    <use href="#word" transform="translate(5.8 7.1)" fill="#b79013" />
    <use href="#word" transform="translate(2.9 3.6)" fill="#c09814" />
    <use href="#word" transform="translate(0 0)" fill="none" stroke="#1a0d00" stroke-width="11" stroke-linejoin="round" />
    <use href="#word" transform="translate(0 0)" fill="url(#face)" stroke="#5a3a00" stroke-width="2.5" stroke-linejoin="round" />
  </g>
</svg>
