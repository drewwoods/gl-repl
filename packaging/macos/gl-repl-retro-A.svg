<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="gl-repl">
  <!-- Garish early-90s 3D-WordArt icon: chrome "gl-repl" extruded in perspective
       toward the grid's vanishing point. gl-repl.svg keeps the cube. -->
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ff2db8" />
      <stop offset="0.5" stop-color="#6a1ea8" />
      <stop offset="1"   stop-color="#0a0626" />
    </linearGradient>
    <radialGradient id="rsun" cx="0.5" cy="0.40" r="0.6">
      <stop offset="0"   stop-color="#ffe14d" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#ff6a3d" stop-opacity="0.5" />
      <stop offset="1"   stop-color="#ff6a3d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.40" stop-color="#bfefff"/>
      <stop offset="0.50" stop-color="#2a86d8"/><stop offset="0.52" stop-color="#0b2f6b"/>
      <stop offset="0.88" stop-color="#79d2ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="rglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="word">
      <text x="512" y="0" text-anchor="middle"
            font-family="Futura, 'Helvetica Neue', Helvetica, sans-serif"
            font-weight="700" font-size="244" letter-spacing="-8">gl-repl</text>
    </g>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" /></clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#rbg)" />
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#rsun)" />

  <g clip-path="url(#round)" stroke="url(#grid)" stroke-width="3" opacity="0.85">
    <line x1="0" y1="730" x2="1024" y2="730" /><line x1="0" y1="772" x2="1024" y2="772" />
    <line x1="0" y1="826" x2="1024" y2="826" /><line x1="0" y1="892" x2="1024" y2="892" />
    <line x1="0" y1="970" x2="1024" y2="970" />
    <line x1="512" y1="715" x2="-260" y2="1024" /><line x1="512" y1="715" x2="40" y2="1024" />
    <line x1="512" y1="715" x2="250" y2="1024" /><line x1="512" y1="715" x2="410" y2="1024" />
    <line x1="512" y1="715" x2="512" y2="1024" /><line x1="512" y1="715" x2="614" y2="1024" />
    <line x1="512" y1="715" x2="774" y2="1024" /><line x1="512" y1="715" x2="984" y2="1024" />
    <line x1="512" y1="715" x2="1284" y2="1024" />
  </g>

  <g filter="url(#rglow)">
      <use href="#word" transform="translate(512 370.0) scale(0.48) translate(-512 -370.0) translate(0 624.0)" fill="#0a0118" />
      <use href="#word" transform="translate(512 370.0) scale(0.5) translate(-512 -370.0) translate(0 624.0)" fill="#0e021e" />
      <use href="#word" transform="translate(512 370.0) scale(0.52) translate(-512 -370.0) translate(0 624.0)" fill="#130324" />
      <use href="#word" transform="translate(512 370.0) scale(0.54) translate(-512 -370.0) translate(0 624.0)" fill="#17042a" />
      <use href="#word" transform="translate(512 370.0) scale(0.56) translate(-512 -370.0) translate(0 624.0)" fill="#1b062f" />
      <use href="#word" transform="translate(512 370.0) scale(0.58) translate(-512 -370.0) translate(0 624.0)" fill="#200735" />
      <use href="#word" transform="translate(512 370.0) scale(0.6) translate(-512 -370.0) translate(0 624.0)" fill="#24083b" />
      <use href="#word" transform="translate(512 370.0) scale(0.62) translate(-512 -370.0) translate(0 624.0)" fill="#280941" />
      <use href="#word" transform="translate(512 370.0) scale(0.64) translate(-512 -370.0) translate(0 624.0)" fill="#2c0a47" />
      <use href="#word" transform="translate(512 370.0) scale(0.66) translate(-512 -370.0) translate(0 624.0)" fill="#310b4d" />
      <use href="#word" transform="translate(512 370.0) scale(0.68) translate(-512 -370.0) translate(0 624.0)" fill="#350d52" />
      <use href="#word" transform="translate(512 370.0) scale(0.7) translate(-512 -370.0) translate(0 624.0)" fill="#390e58" />
      <use href="#word" transform="translate(512 370.0) scale(0.72) translate(-512 -370.0) translate(0 624.0)" fill="#3e0f5e" />
      <use href="#word" transform="translate(512 370.0) scale(0.74) translate(-512 -370.0) translate(0 624.0)" fill="#421064" />
      <use href="#word" transform="translate(512 370.0) scale(0.76) translate(-512 -370.0) translate(0 624.0)" fill="#46116a" />
      <use href="#word" transform="translate(512 370.0) scale(0.78) translate(-512 -370.0) translate(0 624.0)" fill="#4b1270" />
      <use href="#word" transform="translate(512 370.0) scale(0.8) translate(-512 -370.0) translate(0 624.0)" fill="#4f1376" />
      <use href="#word" transform="translate(512 370.0) scale(0.82) translate(-512 -370.0) translate(0 624.0)" fill="#53157b" />
      <use href="#word" transform="translate(512 370.0) scale(0.84) translate(-512 -370.0) translate(0 624.0)" fill="#581681" />
      <use href="#word" transform="translate(512 370.0) scale(0.86) translate(-512 -370.0) translate(0 624.0)" fill="#5c1787" />
      <use href="#word" transform="translate(512 370.0) scale(0.88) translate(-512 -370.0) translate(0 624.0)" fill="#60188d" />
      <use href="#word" transform="translate(512 370.0) scale(0.9) translate(-512 -370.0) translate(0 624.0)" fill="#641993" />
      <use href="#word" transform="translate(512 370.0) scale(0.92) translate(-512 -370.0) translate(0 624.0)" fill="#691a99" />
      <use href="#word" transform="translate(512 370.0) scale(0.94) translate(-512 -370.0) translate(0 624.0)" fill="#6d1c9e" />
      <use href="#word" transform="translate(512 370.0) scale(0.96) translate(-512 -370.0) translate(0 624.0)" fill="#711da4" />
      <use href="#word" transform="translate(512 370.0) scale(0.98) translate(-512 -370.0) translate(0 624.0)" fill="#761eaa" />
    <use href="#word" transform="translate(0 624.0)" fill="none" stroke="#0a0118" stroke-width="11" stroke-linejoin="round" />
    <use href="#word" transform="translate(0 624.0)" fill="url(#face)" stroke="#16264d" stroke-width="2.5" stroke-linejoin="round" />
  </g>
</svg>
