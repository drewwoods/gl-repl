    <line x1="92" y1="1204" x2="106" y2="1204" stroke="#67bf80"/>

    <line x1="104" y1="1146" x2="104" y2="1182" stroke="#98a3cf"/>
    <line x1="104" y1="1146" x2="118" y2="1146" stroke="#98a3cf"/>
    <line x1="104" y1="1182" x2="118" y2="1182" stroke="#98a3cf"/>
