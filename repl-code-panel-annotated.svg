  <text x="48" y="74" fill="#9a9fc1" font-family="Menlo, Monaco, monospace" font-size="16">
    Annotated REPL code panel (redraw of the screenshot)
  </text>

  <g font-family="Menlo, Monaco, monospace" font-size="18">
    <text x="72" y="140" text-anchor="end" fill="#7b81a9">1</text>
    <text x="140" y="140" fill="#8b8fa9">#include &lt;gl_includes.h&gt;</text>

    <text x="72" y="172" text-anchor="end" fill="#7b81a9">2</text>
    <text x="140" y="172" fill="#8b8fa9">#include &lt;math.h&gt;</text>

    <text x="72" y="204" text-anchor="end" fill="#7b81a9">3</text>

    <text x="72" y="236" text-anchor="end" fill="#7b81a9">4</text>
    <text x="140" y="236" fill="#8b8fa9">#ifndef M_PI</text>

    <text x="72" y="268" text-anchor="end" fill="#7b81a9">5</text>
    <text x="140" y="268" fill="#8b8fa9">#define M_PI 3.14159265358979323846</text>

    <text x="72" y="300" text-anchor="end" fill="#7b81a9">6</text>
    <text x="140" y="300" fill="#8b8fa9">#endif</text>

    <text x="72" y="332" text-anchor="end" fill="#7b81a9">7</text>

    <text x="72" y="364" text-anchor="end" fill="#7b81a9">8</text>
    <text x="140" y="364" fill="#8b8fa9">static float g_angle = 0.0f;</text>

    <text x="72" y="396" text-anchor="end" fill="#7b81a9">9</text>
    <text x="140" y="396" fill="#8b8fa9">static int   g_rotating = 0;</text>

    <text x="72" y="428" text-anchor="end" fill="#7b81a9">10</text>
    <text x="140" y="428" fill="#8b8fa9">static GLUquadric *g_quadric = NULL;</text>

    <text x="72" y="460" text-anchor="end" fill="#7b81a9">11</text>

    <text x="72" y="492" text-anchor="end" fill="#7b81a9">12</text>
    <text x="140" y="492" fill="#8b8fa9">void display() {</text>

    <text x="72" y="524" text-anchor="end" fill="#7b81a9">13</text>
    <text x="140" y="524" fill="#8b8fa9">glClear(GL_COLOR_BUFFER_BIT |</text>

    <text x="72" y="556" text-anchor="end" fill="#7b81a9">14</text>
    <text x="232" y="556" fill="#8b8fa9">GL_DEPTH_BUFFER_BIT);</text>

    <text x="72" y="588" text-anchor="end" fill="#7b81a9">15</text>
    <text x="140" y="588" fill="#8b8fa9">glLoadIdentity();</text>

    <text x="72" y="620" text-anchor="end" fill="#7b81a9">16</text>
    <text x="140" y="620" fill="#b49cc5">glEnable(GL_MULTISAMPLE);</text>

    <text x="72" y="652" text-anchor="end" fill="#7b81a9">17</text>
    <text x="140" y="652" fill="#b49cc5">glEnable(GL_LINE_SMOOTH);</text>

    <text x="72" y="684" text-anchor="end" fill="#7b81a9">18</text>
    <text x="140" y="684" fill="#9fc1de">gluLookAt(-2.35, 1.71, 4.07,</text>

    <text x="72" y="716" text-anchor="end" fill="#7b81a9">19</text>
    <text x="286" y="716" fill="#9fc1de">-0.00, -0.00, 0.00,</text>

    <text x="72" y="748" text-anchor="end" fill="#7b81a9">20</text>
    <text x="286" y="748" fill="#9fc1de">0.0, 1.0, 0.0);</text>

    <text x="72" y="780" text-anchor="end" fill="#7b81a9">21</text>
    <text x="140" y="780" fill="#8b8fa9">glRotatef(g_angle, 0.0f, 1.0f, 0.0f);</text>

    <text x="72" y="812" text-anchor="end" fill="#7b81a9">22</text>
    <text x="140" y="812" fill="#dde2ee">glEnable(GL_DEPTH_TEST);</text>

    <text x="72" y="844" text-anchor="end" fill="#7b81a9">23</text>
    <text x="140" y="844" fill="#dde2ee">glEnable(GL_LIGHTING);</text>

    <text x="72" y="876" text-anchor="end" fill="#7b81a9">24</text>
    <text x="140" y="876" fill="#dde2ee">glEnable(GL_COLOR_MATERIAL);</text>

    <text x="72" y="908" text-anchor="end" fill="#7b81a9">25</text>
    <text x="140" y="908" fill="#dde2ee">glEnable(GL_NORMALIZE);</text>

    <text x="72" y="940" text-anchor="end" fill="#7b81a9">26</text>
    <text x="140" y="940" fill="#dde2ee">glShadeModel(GL_SMOOTH);</text>

    <text x="72" y="972" text-anchor="end" fill="#7b81a9">27</text>
    <text x="140" y="972" fill="#dde2ee">glEnable(GL_LIGHT3);</text>

    <text x="72" y="1004" text-anchor="end" fill="#7b81a9">28</text>
    <text x="140" y="1004" fill="#dde2ee">glEnable(GL_LIGHT2);</text>

    <text x="72" y="1036" text-anchor="end" fill="#7b81a9">29</text>
    <text x="140" y="1036" fill="#666b78">//glEnable(GL_LINE_SMOOTH)</text>

    <text x="72" y="1068" text-anchor="end" fill="#7b81a9">30</text>
    <text x="140" y="1068" fill="#f1d84f">glColor3f(1, 1, 1);</text>

    <text x="72" y="1100" text-anchor="end" fill="#7b81a9">31</text>
    <text x="140" y="1100" fill="#d860ea">glBegin(GL_QUAD_STRIP);</text>

    <text x="72" y="1132" text-anchor="end" fill="#7b81a9">32</text>
    <text x="140" y="1132" fill="#55d2ff">glNormal3f(0, 1, 0);</text>

    <text x="72" y="1164" text-anchor="end" fill="#7b81a9">33</text>
    <text x="108" y="1164" fill="#7b81a9">v0</text>
    <text x="140" y="1164" fill="#68ff84">glVertex3f(1, 1, 1);</text>

    <text x="72" y="1196" text-anchor="end" fill="#7b81a9">34</text>
    <text x="140" y="1196" fill="#55d2ff">glNormal3f(0, 1, 0);</text>
  </g>

