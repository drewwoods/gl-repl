<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1520" viewBox="0 0 1760 1520">
  <rect width="1760" height="1520" fill="#0b0e16"/>
  <rect x="20" y="20" width="1020" height="1480" rx="22" fill="#111623" stroke="#313a55" stroke-width="2"/>
  <rect x="1060" y="20" width="680" height="1480" rx="22" fill="#141a29" stroke="#313a55" stroke-width="2"/>

  <text x="48" y="72" fill="#cfd7f6" font-family="Menlo, Monaco, monospace" font-size="20">
    Annotated REPL code panel (current scaffold layout)
  </text>
  <text x="48" y="100" fill="#8f98b9" font-family="Menlo, Monaco, monospace" font-size="14">
    Updated for g_render_state_lines[], g_cam_lines[], and an empty g_header_post[].
  </text>

  <g font-family="Menlo, Monaco, monospace" font-size="18">
    <text x="72" y="132" text-anchor="end" fill="#6f7aa6">1</text>
    <text x="140" y="132" fill="#95a0bf">#include &lt;gl_includes.h&gt;</text>
    <text x="72" y="164" text-anchor="end" fill="#6f7aa6">2</text>
    <text x="140" y="164" fill="#95a0bf">#include &lt;math.h&gt;</text>
    <text x="72" y="196" text-anchor="end" fill="#6f7aa6">3</text>
    <text x="72" y="228" text-anchor="end" fill="#6f7aa6">4</text>
    <text x="140" y="228" fill="#95a0bf">#ifndef M_PI</text>
    <text x="72" y="260" text-anchor="end" fill="#6f7aa6">5</text>
    <text x="140" y="260" fill="#95a0bf">#define M_PI 3.14159265358979323846</text>
    <text x="72" y="292" text-anchor="end" fill="#6f7aa6">6</text>
    <text x="140" y="292" fill="#95a0bf">#endif</text>
    <text x="72" y="324" text-anchor="end" fill="#6f7aa6">7</text>
    <text x="72" y="356" text-anchor="end" fill="#6f7aa6">8</text>
    <text x="140" y="356" fill="#95a0bf">static float g_angle = 0.0f;</text>
    <text x="72" y="388" text-anchor="end" fill="#6f7aa6">9</text>
    <text x="140" y="388" fill="#95a0bf">static int   g_rotating = 0;</text>
    <text x="72" y="420" text-anchor="end" fill="#6f7aa6">10</text>
    <text x="140" y="420" fill="#95a0bf">static GLUquadric *g_quadric = NULL;</text>
    <text x="72" y="452" text-anchor="end" fill="#6f7aa6">11</text>
    <text x="72" y="484" text-anchor="end" fill="#6f7aa6">12</text>
    <text x="140" y="484" fill="#95a0bf">void display() {</text>
    <text x="72" y="516" text-anchor="end" fill="#6f7aa6">13</text>
    <text x="140" y="516" fill="#95a0bf">  glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);</text>
    <text x="72" y="548" text-anchor="end" fill="#6f7aa6">14</text>
    <text x="140" y="548" fill="#95a0bf">  glLoadIdentity();</text>
    <text x="72" y="580" text-anchor="end" fill="#6f7aa6">15</text>
    <text x="140" y="580" fill="#95a0bf">  glPushAttrib(GL_ALL_ATTRIB_BITS);</text>

    <text x="72" y="612" text-anchor="end" fill="#6f7aa6">16</text>
    <text x="140" y="612" fill="#c3a8ff">  glEnable(GL_MULTISAMPLE);</text>
    <text x="72" y="644" text-anchor="end" fill="#6f7aa6">17</text>
    <text x="140" y="644" fill="#c3a8ff">  glDisable(GL_LINE_SMOOTH);</text>

    <text x="72" y="676" text-anchor="end" fill="#6f7aa6">18</text>
    <text x="140" y="676" fill="#8fd5ff">  glTranslatef(0.0000f, 0.0000f, -5.5000f);</text>
    <text x="72" y="708" text-anchor="end" fill="#6f7aa6">19</text>
    <text x="140" y="708" fill="#8fd5ff">  glRotatef(18.0000f, 1.0f, 0.0f, 0.0f);</text>
    <text x="72" y="740" text-anchor="end" fill="#6f7aa6">20</text>
    <text x="140" y="740" fill="#8fd5ff">  glRotatef(32.0000f, 0.0f, 1.0f, 0.0f);</text>
    <text x="72" y="772" text-anchor="end" fill="#6f7aa6">21</text>
    <text x="140" y="772" fill="#8fd5ff">  glTranslatef(-0.0000f, -0.0000f, -0.0000f);</text>

    <text x="72" y="804" text-anchor="end" fill="#6f7aa6">22</text>
    <text x="140" y="804" fill="#dfe6f5">  glEnable(GL_DEPTH_TEST);</text>
    <text x="72" y="836" text-anchor="end" fill="#6f7aa6">23</text>
    <text x="140" y="836" fill="#dfe6f5">  glEnable(GL_LIGHTING);</text>
    <text x="72" y="868" text-anchor="end" fill="#6f7aa6">24</text>
    <text x="140" y="868" fill="#dfe6f5">  glEnable(GL_NORMALIZE);</text>
    <text x="72" y="900" text-anchor="end" fill="#6f7aa6">25</text>
    <text x="140" y="900" fill="#dfe6f5">  glShadeModel(GL_SMOOTH);</text>
    <text x="72" y="932" text-anchor="end" fill="#6f7aa6">26</text>
    <text x="140" y="932" fill="#dfe6f5">  glEnable(GL_LIGHT3);</text>
    <text x="72" y="964" text-anchor="end" fill="#6f7aa6">27</text>
    <text x="140" y="964" fill="#dfe6f5">  glEnable(GL_LIGHT2);</text>
    <text x="72" y="996" text-anchor="end" fill="#6f7aa6">28</text>
    <text x="140" y="996" fill="#6d7385">  //glEnable(GL_LINE_SMOOTH)</text>
    <text x="72" y="1028" text-anchor="end" fill="#6f7aa6">29</text>
    <text x="140" y="1028" fill="#f7d85d">  glColor3f(1, 1, 1);</text>
    <text x="72" y="1060" text-anchor="end" fill="#6f7aa6">30</text>
    <text x="140" y="1060" fill="#d57cff">  glBegin(GL_QUAD_STRIP);</text>
    <text x="72" y="1092" text-anchor="end" fill="#6f7aa6">31</text>
    <text x="140" y="1092" fill="#60d7ff">    glNormal3f(0, 1, 0);</text>
    <text x="72" y="1124" text-anchor="end" fill="#6f7aa6">32</text>
    <text x="110" y="1124" fill="#9aa4cf">v0</text>
    <text x="140" y="1124" fill="#74ff95">    glVertex3f(1, 1, 1);</text>
    <text x="72" y="1156" text-anchor="end" fill="#6f7aa6">33</text>
    <text x="140" y="1156" fill="#60d7ff">    glNormal3f(0, 1, 0);</text>
    <text x="72" y="1188" text-anchor="end" fill="#6f7aa6">34</text>
    <text x="110" y="1188" fill="#9aa4cf">v1</text>
    <text x="140" y="1188" fill="#74ff95">    glVertex3f(-1, 1, 1);</text>
  </g>

  <g fill="none" stroke-width="3">
    <line x1="92" y1="118" x2="92" y2="592" stroke="#7fa0ff"/>
    <line x1="92" y1="118" x2="108" y2="118" stroke="#7fa0ff"/>
    <line x1="92" y1="592" x2="108" y2="592" stroke="#7fa0ff"/>

    <line x1="92" y1="604" x2="92" y2="656" stroke="#b888ee"/>
    <line x1="92" y1="604" x2="108" y2="604" stroke="#b888ee"/>
    <line x1="92" y1="656" x2="108" y2="656" stroke="#b888ee"/>

    <line x1="92" y1="668" x2="92" y2="784" stroke="#82c3ff"/>
    <line x1="92" y1="668" x2="108" y2="668" stroke="#82c3ff"/>
    <line x1="92" y1="784" x2="108" y2="784" stroke="#82c3ff"/>

    <line x1="92" y1="796" x2="92" y2="1202" stroke="#67bf80"/>
    <line x1="92" y1="796" x2="108" y2="796" stroke="#67bf80"/>
    <line x1="92" y1="1202" x2="108" y2="1202" stroke="#67bf80"/>

    <line x1="104" y1="1110" x2="104" y2="1200" stroke="#98a3cf"/>
    <line x1="104" y1="1110" x2="120" y2="1110" stroke="#98a3cf"/>
    <line x1="104" y1="1200" x2="120" y2="1200" stroke="#98a3cf"/>
  </g>

  <g fill="#0b0e16">
    <circle cx="108" cy="356" r="5"/>
    <circle cx="108" cy="628" r="5"/>
    <circle cx="108" cy="724" r="5"/>
    <circle cx="108" cy="1000" r="5"/>
    <circle cx="120" cy="1156" r="5"/>
  </g>
  <g>
    <circle cx="108" cy="356" r="3" fill="#7fa0ff"/>
    <circle cx="108" cy="628" r="3" fill="#b888ee"/>
    <circle cx="108" cy="724" r="3" fill="#82c3ff"/>
    <circle cx="108" cy="1000" r="3" fill="#67bf80"/>
    <circle cx="120" cy="1156" r="3" fill="#98a3cf"/>
  </g>

  <g fill="none" stroke-width="3.5">
    <line x1="108" y1="356" x2="1088" y2="238" stroke="#7fa0ff"/>
    <line x1="108" y1="628" x2="1088" y2="466" stroke="#b888ee"/>
    <line x1="108" y1="724" x2="1088" y2="654" stroke="#82c3ff"/>
    <line x1="108" y1="1000" x2="1088" y2="934" stroke="#67bf80"/>
    <line x1="120" y1="1156" x2="1088" y2="1182" stroke="#98a3cf"/>
  </g>

  <g font-family="Menlo, Monaco, monospace">
    <rect x="1088" y="154" width="620" height="210" rx="16" fill="#182138" stroke="#7fa0ff" stroke-width="2"/>
    <text x="1114" y="190" fill="#e7edff" font-size="17">A. Lines 1-15: g_header_pre[]</text>
    <text x="1114" y="224" fill="#e7edff" font-size="15">Static scaffold preview: includes, globals, and the opening</text>
    <text x="1114" y="252" fill="#e7edff" font-size="15">of display(). This block is owned by repl_export.c and reused by</text>
    <text x="1114" y="280" fill="#e7edff" font-size="15">the code-panel dump helpers.</text>
    <text x="1114" y="308" fill="#e7edff" font-size="15">Export note: save_output() can emit a slightly different header when</text>
    <text x="1114" y="336" fill="#e7edff" font-size="15">the exported C intentionally diverges from the panel preview.</text>

    <rect x="1088" y="404" width="620" height="116" rx="16" fill="#231b32" stroke="#b888ee" stroke-width="2"/>
    <text x="1114" y="440" fill="#f1e6ff" font-size="17">B. Lines 16-17: g_render_state_lines[]</text>
    <text x="1114" y="474" fill="#f1e6ff" font-size="15">Generated from config toggles such as MSAA and line smoothing.</text>
    <text x="1114" y="502" fill="#f1e6ff" font-size="15">Refreshed for preview, dump, and export.</text>

    <rect x="1088" y="560" width="620" height="172" rx="16" fill="#1d2635" stroke="#82c3ff" stroke-width="2"/>
    <text x="1114" y="596" fill="#e6f6ff" font-size="17">C. Lines 18-21: g_cam_lines[]</text>
    <text x="1114" y="630" fill="#e6f6ff" font-size="15">Current camera scaffold: distance translate, X rotation,</text>
    <text x="1114" y="658" fill="#e6f6ff" font-size="15">Y rotation, then orbit-target translate.</text>
    <text x="1114" y="686" fill="#e6f6ff" font-size="15">The old gluLookAt-based panel is gone; this block now reflects</text>
    <text x="1114" y="714" fill="#e6f6ff" font-size="15">the camera-string path used by the current panel preview.</text>

    <rect x="1088" y="770" width="620" height="112" rx="16" fill="#242632" stroke="#9ea7bd" stroke-width="2"/>
    <text x="1114" y="806" fill="#edf0ff" font-size="17">D. Optional g_header_post[] hook</text>
    <text x="1114" y="840" fill="#edf0ff" font-size="15">This hook exists after the camera block, but it currently emits</text>
    <text x="1114" y="868" fill="#edf0ff" font-size="15">zero visible lines in the panel.</text>

    <rect x="1088" y="900" width="620" height="242" rx="16" fill="#18251d" stroke="#67bf80" stroke-width="2"/>
    <text x="1114" y="936" fill="#e8fff0" font-size="17">E. Lines 22+: g_cmds[i].source</text>
    <text x="1114" y="970" fill="#e8fff0" font-size="15">Visible user/example commands stored in g_cmds[].</text>
    <text x="1114" y="998" fill="#e8fff0" font-size="15">This block is the semantic source of truth for parsing, flattening,</text>
    <text x="1114" y="1026" fill="#e8fff0" font-size="15">execution, replay, and export.</text>
    <text x="1114" y="1054" fill="#e8fff0" font-size="15">The example shown here is a current built-in example dump, not a</text>
    <text x="1114" y="1082" fill="#e8fff0" font-size="15">hand-written fake command list.</text>
    <text x="1114" y="1110" fill="#e8fff0" font-size="15">Export translates these lines into render_repl_geometry().</text>

    <rect x="1088" y="1150" width="620" height="128" rx="16" fill="#22252c" stroke="#98a3cf" stroke-width="2"/>
    <text x="1114" y="1186" fill="#eef0ff" font-size="17">F. Gutter labels v0 / v1</text>
    <text x="1114" y="1220" fill="#eef0ff" font-size="15">Computed while drawing the code panel.</text>
    <text x="1114" y="1248" fill="#eef0ff" font-size="15">They are not stored in g_cmds[] and are not exported as C.</text>

    <rect x="1088" y="1296" width="620" height="174" rx="16" fill="#2a2018" stroke="#c48a58" stroke-width="2"/>
    <text x="1114" y="1332" fill="#fff0de" font-size="17">G. Not shown in this panel sketch</text>
    <text x="1114" y="1366" fill="#fff0de" font-size="15">Workspace header comments and the init-section listing are separate</text>
    <text x="1114" y="1394" fill="#fff0de" font-size="15">export/runtime surfaces. They exist in the exporter and UI, but they</text>
    <text x="1114" y="1422" fill="#fff0de" font-size="15">are intentionally not part of this left-hand code-panel redraw.</text>
    <text x="1114" y="1450" fill="#fff0de" font-size="15">That keeps the annotation focused on the visible scaffold plus source.</text>
  </g>
</svg>
