  <g font-family="Menlo, Monaco, monospace">
    <rect x="1100" y="250" width="600" height="172" rx="14" fill="#172034" stroke="#7fa0ff" stroke-width="2"/>
    <text x="1124" y="286" fill="#e3e8ff" font-size="17">A. Lines 1-15</text>
    <text x="1124" y="320" fill="#e3e8ff" font-size="15">Stored in g_header_pre[].</text>
    <text x="1124" y="348" fill="#e3e8ff" font-size="15">Static scaffold preview in the REPL.</text>
    <text x="1124" y="376" fill="#e3e8ff" font-size="15">Exported by save_output() before</text>
    <text x="1124" y="404" fill="#e3e8ff" font-size="15">the generated display() body.</text>

    <rect x="1100" y="540" width="600" height="112" rx="14" fill="#221b2f" stroke="#b888ee" stroke-width="2"/>
    <text x="1124" y="576" fill="#efe5ff" font-size="17">B. Lines 16-17</text>
    <text x="1124" y="610" fill="#efe5ff" font-size="15">g_render_state_lines[].</text>
    <text x="1124" y="638" fill="#efe5ff" font-size="15">Generated from toggle state every frame and export.</text>

    <rect x="1100" y="658" width="600" height="140" rx="14" fill="#1f2433" stroke="#82c3ff" stroke-width="2"/>
    <text x="1124" y="694" fill="#e5f3ff" font-size="17">C. Lines 18-20</text>
    <text x="1124" y="728" fill="#e5f3ff" font-size="15">g_lookat[].</text>
    <text x="1124" y="756" fill="#e5f3ff" font-size="15">Generated from camera orbit, pan, and zoom</text>
    <text x="1124" y="784" fill="#e5f3ff" font-size="15">before both panel rendering and export.</text>

    <rect x="1100" y="792" width="600" height="92" rx="14" fill="#1d1f2c" stroke="#97a0b4" stroke-width="2"/>
    <text x="1124" y="828" fill="#eef1ff" font-size="17">D. Line 21</text>
    <text x="1124" y="862" fill="#eef1ff" font-size="15">g_header_post[]. Static post-lookAt scaffold line.</text>

    <rect x="1100" y="914" width="600" height="256" rx="14" fill="#18221d" stroke="#67bf80" stroke-width="2"/>
    <text x="1124" y="950" fill="#e6fff0" font-size="17">E. Lines 22+</text>
    <text x="1124" y="984" fill="#e6fff0" font-size="15">Visible user or example commands.</text>
    <text x="1124" y="1012" fill="#e6fff0" font-size="15">Stored as g_cmds[i].source and parsed GLCmd</text>
    <text x="1124" y="1040" fill="#e6fff0" font-size="15">records in g_cmds[].</text>
    <text x="1124" y="1068" fill="#e6fff0" font-size="15">Can be typed, imported, or loaded from</text>
    <text x="1124" y="1096" fill="#e6fff0" font-size="15">repl_examples.c via load_example().</text>
    <text x="1124" y="1124" fill="#e6fff0" font-size="15">Current screenshot: example path.</text>
    <text x="1124" y="1152" fill="#e6fff0" font-size="15">Exported into render_repl_geometry().</text>

    <rect x="1100" y="1180" width="600" height="144" rx="14" fill="#222327" stroke="#98a3cf" stroke-width="2"/>
    <text x="1124" y="1216" fill="#eef0ff" font-size="17">F. Gutter labels v0 / v1</text>
    <text x="1124" y="1250" fill="#eef0ff" font-size="15">Computed in render_code_panel().</text>
    <text x="1124" y="1278" fill="#eef0ff" font-size="15">Not stored in g_cmds[] and not exported</text>
    <text x="1124" y="1306" fill="#eef0ff" font-size="15">as C source.</text>

    <rect x="1100" y="1340" width="600" height="138" rx="14" fill="#2a1f18" stroke="#c58c59" stroke-width="2"/>
    <text x="1124" y="1376" fill="#fff1e0" font-size="17">Note</text>
    <text x="1124" y="1410" fill="#fff1e0" font-size="15">Some visible state lines resemble hidden bootstrap</text>
    <text x="1124" y="1438" fill="#fff1e0" font-size="15">defaults, but the visible screenshot lines themselves</text>
    <text x="1124" y="1466" fill="#fff1e0" font-size="15">still come from g_cmds[].</text>
  </g>
