name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # check-trailing-whitespace diffs against origin/main's merge base
          fetch-depth: 0

      # Installed before the C99 ratchet on purpose: with no GL dev headers
      # the guard falls back to the no-op stub headers, which cannot check
      # the LD_PRELOAD interposition library (its replacements are the real
      # GL symbol names, and the stubs define those as static inline no-ops).
      # Real headers here mean the ratchet covers the ELF branch of
      # tools/glprobe/glprobe_preload.c, which nothing else in CI compiles.
      - name: Install GL/GLUT dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev

      - name: C99 ratchet (real gcc)
        run: make check-c99

      - name: Stub test suite (ASan + UBSan, no GL libs)
        run: make test-stubs

      - name: Build gl-repl against system GL/GLUT
        run: make gl-repl
